[project]
name = "eip-mcp"
version = "3.0.1"
description = "MCP server for the Exploit Intelligence Platform v3 research API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Exploit Intel" }]
keywords = ["cve", "exploit", "mcp", "security", "vulnerability-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx2>=2.5.0,<3",
]

[project.urls]
Homepage = "https://exploit-intel.com"
Documentation = "https://github.com/exploitintel/eip-mcp/blob/main/docs/user-guide.md"
Issues = "https://github.com/exploitintel/eip-mcp/issues"
Source = "https://github.com/exploitintel/eip-mcp"

[project.scripts]
eip-mcp = "eip_mcp_v3.__main__:entrypoint"
eip-mcp-v3 = "eip_mcp_v3.__main__:entrypoint"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
